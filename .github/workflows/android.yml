name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable QA signing key
        id: signing-key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/geopilot-qa.jks
          key: geopilot-qa-signing-v1

      - name: Create stable QA signing key
        if: steps.signing-key.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/geopilot-qa.jks" \
            -storepass "$GEOPILOT_KEYSTORE_PASSWORD" \
            -alias "$GEOPILOT_KEY_ALIAS" \
            -keypass "$GEOPILOT_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Harcomoyo, OU=GeoPilot QA, O=GeoPilot, L=Jakarta, C=ID"
        env:
          GEOPILOT_KEYSTORE_PASSWORD: geopilot-qa-update-key
          GEOPILOT_KEY_ALIAS: geopilot
          GEOPILOT_KEY_PASSWORD: geopilot-qa-update-key

      - name: Verify and build
        run: ./gradlew lint test assembleDebug --stacktrace
        env:
          ORG_GRADLE_PROJECT_GEOPILOT_KEYSTORE_PATH: ${{ runner.temp }}/geopilot-qa.jks
          ORG_GRADLE_PROJECT_GEOPILOT_KEYSTORE_PASSWORD: geopilot-qa-update-key
          ORG_GRADLE_PROJECT_GEOPILOT_KEY_ALIAS: geopilot
          ORG_GRADLE_PROJECT_GEOPILOT_KEY_PASSWORD: geopilot-qa-update-key

      - name: Generate checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: geopilot-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare release assets
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk GeoPilot-${GITHUB_REF_NAME}-unsigned.apk
          sha256sum GeoPilot-${GITHUB_REF_NAME}-unsigned.apk > GeoPilot-${GITHUB_REF_NAME}-unsigned.apk.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            GeoPilot-${{ github.ref_name }}-unsigned.apk
            GeoPilot-${{ github.ref_name }}-unsigned.apk.sha256
